<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>基金配置工作台</title>
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="container">

  <div class="topbar">
    <h1>🏦 基金配置工作台</h1>
    <div class="right">
      <button class="btn-mini" onclick="window.print()">🖨 导出PDF</button>
      <button class="btn-mini" onclick="logout()">退出</button>
    </div>
  </div>

  <!-- ===== 工作台视图 ===== -->
  <div id="wbView">
    <div class="wb-main">

      <!-- 左栏：代码输入 + 筛选 + 结果列表 -->
      <div class="wb-left">
        <!-- 代码输入区（单个输入 + 添加按钮） -->
        <div class="panel">
          <div class="panel-title">🔢 输入基金代码</div>
          <div class="filter-row">
            <input id="codeInput" placeholder="6位基金代码，如 001065" maxlength="6" inputmode="numeric" onkeydown="if(event.key==='Enter')addByCode()">
            <button class="btn-primary" onclick="addByCode()">添加</button>
          </div>
          <div style="font-size:.7rem;color:var(--text-muted)">输入代码点「添加」或按回车，基金将加入右侧「已选基金」</div>
        </div>

        <!-- 筛选/搜索 -->
        <div class="panel filter-area">
          <div class="panel-title">🔍 按条件筛选</div>
          <div class="filter-row">
            <input id="fQ" placeholder="名称 / 拼音 / 代码关键词，如：红利" onkeydown="if(event.key==='Enter')doSearch(1)">
          </div>
          <div class="panel-title" style="margin-top:4px">分类（可多选）</div>
          <div class="tabs" id="catChips">
            <span class="chip" data-cat="指数型">指数型</span>
            <span class="chip" data-cat="股票型">股票型</span>
            <span class="chip" data-cat="混合型">混合型</span>
            <span class="chip" data-cat="债券型">债券型</span>
            <span class="chip" data-cat="货币型">货币型</span>
            <span class="chip" data-cat="QDII">QDII</span>
            <span class="chip" data-cat="FOF">FOF</span>
            <span class="chip" data-cat="商品REITs">商品REITs</span>
          </div>
          <div class="panel-title" style="margin-top:4px">基金公司（可多选）</div>
          <div class="filter-row">
            <input id="fCompany" placeholder="输入公司名搜索，如：易方达 / 华夏" onkeyup="companySuggest(this.value)" onkeydown="if(event.key==='Enter')doSearch(1)">
          </div>
          <div id="compSuggest" class="comp-suggest"></div>
          <div id="compSel" class="sel-list" style="margin:6px 0 10px"></div>
          <button class="btn-primary" onclick="doSearch(1)">筛选</button>
          <div class="panel-title" style="margin-top:4px">📈 按业绩排名排序</div>
          <div class="tabs" id="rankTabs">
            <span class="tab" data-sc="1yzf">近1月</span>
            <span class="tab" data-sc="3yzf">近3月</span>
            <span class="tab on" data-sc="1nzf">近1年</span>
            <span class="tab" data-sc="2nzf">近2年</span>
            <span class="tab" data-sc="3nzf">近3年</span>
          </div>
          <div id="resList"><div class="res-empty">输入代码加入，或按分类/公司/关键词筛选、点排名窗口看榜单，点「加入」放入右侧已选。</div></div>
          <div class="res-more"><button class="btn-mini" id="moreBtn" style="display:none" onclick="loadMore()">加载更多</button></div>
        </div>
      </div>

      <!-- 右栏：已选小窗口 -->
      <div class="wb-right">
        <div class="panel sel-panel">
          <div class="panel-title">✅ 已选基金 <span id="selCount" style="color:var(--text-muted);font-weight:400"></span>
            <span style="float:right"><button class="btn-mini" onclick="clearSel()">清空</button></span>
          </div>
          <div class="sel-list" id="selList"><span class="sel-empty">尚未选择基金</span></div>
          <button class="btn-success" id="genBtn" style="margin-top:12px" onclick="generate()">🎯 生成报告</button>
          <div style="font-size:.7rem;color:var(--text-muted);margin-top:8px;text-align:center">抓取天天基金数据生成「重点基金配置建议」报告，约 5-20 秒</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== 报告视图（生成后进入） ===== -->
  <div id="reportView" style="display:none">
    <div style="margin-bottom:12px">
      <button class="btn-mini" onclick="backToWorkbench()">← 返回继续选基金</button>
      <span style="margin-left:10px;font-size:.85rem;color:var(--text-muted)">重点基金配置建议</span>
    </div>
    <div id="out"><div class="loading" id="loading" style="display:none">⏳ 正在获取数据并生成报告…</div></div>
  </div>

  <div class="footer">数据来源：天天基金网 · 业绩/排名截至查询日 · 本工具仅供内部参考，不构成投资建议</div>
</div>

<!-- 移动端底部固定生成栏 -->
<div class="mobile-gen">
  <button class="btn-success" id="genBtnM" onclick="generate()">🎯 生成报告</button>
</div>

<script src="charts.js"></script>
<script src="card-render.js"></script>
<script src="app.js"></script>
</body>
</html>
